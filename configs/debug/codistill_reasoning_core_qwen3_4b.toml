# Codistill on reasoning-core-env with Qwen3-4B (bigger student than the 1.5B variant).
#
# Same setup as codistill_reasoning_core.toml (formally-verified symbolic reasoning,
# levels 2-3, 512 problems, binary reward so correct_reward_threshold=0.8 == "fully
# correct"), but a 4B student. codistill holds student+teacher BOTH in trainer memory with
# two AdamW optimizers, but the teacher optimizer is freed after RFT each stage (it's rebuilt
# from the re-cloned teacher next stage anyway), so only the student AdamW state is resident
# during OPD. That plus seq_len=10240 (8k completions) fits 2 infer + 2 train on a100l:4:
#   CONFIG=configs/debug/codistill_reasoning_core_qwen3_4b.toml \
#     NUM_INFER_GPUS=2 NUM_TRAIN_GPUS=2 sbatch scripts/mila/codistill.sh
max_steps = 10  # stages
seq_len = 10240  # 8192-tok completion + 2048-tok prompt budget (longer prompts drop; p99 ~2.5k)

[model]
name = "Qwen/Qwen3-4B"

[trainer.model.ac]  # activation checkpointing — two models in trainer memory

[wandb]
project = "reasoning-core-codistill"
name = "codistill-reasoning-core-l2-3-qwen3-4b"

[orchestrator]
batch_size = 32
group_size = 8

[orchestrator.train.sampling]
temperature = 0.6
max_completion_tokens = 8192

[[orchestrator.train.env]]
id = "reasoning-core/reasoning-core-env"
name = "reasoning-core-env"  # keep metric/buffer keys flat (id carries the hub owner for auto-install)
args = { dataset_name = "kushasareen/reasoning-core-l2-3-n512", num_train_examples = 512, num_eval_examples = 128 }

[trainer]
rl_steps = 1
rft_steps = 4
opd_steps = 1
correct_reward_threshold = 0.8

[trainer.optim]  # student
lr = 3e-6

[trainer.teacher_optim]
type = "adamw"
lr = 1e-5

[inference]

# Qwen3-4B emits <think> reasoning; opt into DefaultRenderer with the think parser.
[orchestrator.renderer]
name = "default"
reasoning_parser = "think"
